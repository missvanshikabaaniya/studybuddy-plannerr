
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBuddy Planner</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px 16px;
  font-family: Arial, sans-serif;
  background: #f3f0ff;
  color: #292344;
}
.container {
  max-width: 500px;
  margin: auto;
}
header {
  background: #7254d6;
  color: white;
  padding: 25px;
  border-radius: 18px;
}
h1 { margin-top: 0; }
.card {
  background: white;
  padding: 20px;
  margin-top: 18px;
  border-radius: 16px;
}
input, button {
  padding: 13px;
  border-radius: 9px;
  font-size: 16px;
}
input {
  width: 100%;
  border: 1px solid #ccc;
  margin-bottom: 10px;
}
button {
  border: none;
  background: #7254d6;
  color: white;
  cursor: pointer;
}
#add { width: 100%; }
.task {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}
.task span { overflow-wrap: anywhere; }
.done { text-decoration: line-through; color: gray; }
.delete { background: #dc5265; }
.bar {
  height: 12px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
}
#progress {
  height: 100%;
  width: 0%;
  background: #7254d6;
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📚 StudyBuddy</h1>
<p>Your smart study planner!</p>
<h3 id="message">Every small step counts! 🌟</h3>
</header>

<div class="card">
<h2>➕ Add Study Task</h2>
<input id="taskInput" placeholder="Enter your study task">
<button id="add" onclick="addTask()">Add Task</button>
</div>

<div class="card">
<h2>📖 My Tasks</h2>
<div id="tasks">No tasks yet!</div>
</div>

<div class="card">
<h2>📊 Your Progress</h2>
<p id="count">0 of 0 completed</p>
<div class="bar"><div id="progress"></div></div>
<p id="percent">0% completed</p>
</div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("studyTasks") || "[]");

function save() {
 localStorage.setItem("studyTasks", JSON.stringify(tasks));
 render();
}

function addTask() {
 const input = document.getElementById("taskInput");
 const value = input.value.trim();
 if (!value) {
   alert("Please enter a task!");
   return;
 }
 tasks.push({text:value, done:false});
 input.value = "";
 save();
}

function toggleTask(index) {
 tasks[index].done = !tasks[index].done;
 save();
}

function deleteTask(index) {
 tasks.splice(index, 1);
 save();
}

function render() {
 const area = document.getElementById("tasks");
 area.innerHTML = "";

 tasks.forEach((task, index) => {
  const div = document.createElement("div");
  div.className = "task";

  const span = document.createElement("span");
  span.textContent = task.text;
  if (task.done) span.className = "done";

  const check = document.createElement("button");
  check.textContent = task.done ? "Undo" : "Done";
  check.onclick = () => toggleTask(index);

  const del = document.createElement("button");
  del.textContent = "Delete";
  del.className = "delete";
  del.onclick = () => deleteTask(index);

  div.append(span, check, del);
  area.appendChild(div);
 });

 if (tasks.length === 0) {
  area.textContent = "No tasks yet!";
 }

 const completed = tasks.filter(t => t.done).length;
 const percentage = tasks.length
  ? Math.round(completed / tasks.length * 100) : 0;

 document.getElementById("count").textContent =
  completed + " of " + tasks.length + " completed";

 document.getElementById("progress").style.width =
  percentage + "%";

 document.getElementById("percent").textContent =
  percentage + "% completed";
}

render();
</script>
</body>
</html>
